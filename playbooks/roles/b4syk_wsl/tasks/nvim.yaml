- name: NVim | Check if nvim is installed
  ansible.builtin.command: command -v nvim
  register: nvim_check
  changed_when: false
  failed_when: false

- name: NVim | Uninstall if it exists
  ansible.builtin.apt:
    name: neovim
    state: absent
  when: nvim_check.rc == 0

- name: NVim | Ensure nvim extraction folder exists
  ansible.builtin.file:
    path: "{{ b4syk_nvim_extract_path }}"
    state: "directory"
    owner: root
    group: root
    mode: "755"

- name: NVim | Download nvim Core tarball in /tmp
  ansible.builtin.get_url:
    url: "{{ b4syk_nvim_installer_url }}"
    dest: "/tmp/nvim-linux-x86_64.tar.gz"

- name: NVim | Extract nvim Core tarball from /tmp to {{ b4syk_nvim_extract_path }}
  ansible.builtin.unarchive:
    src: "/tmp/nvim-linux-x86_64.tar.gz"
    dest: "{{ b4syk_nvim_extract_path  }}"
    remote_src: yes

- name: NVim | Ensure /home/{{ local_user }}/.config dir exists
  ansible.builtin.file:
    path: "/home/{{ local_user }}/.config"
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0700"

- name: NVim | Ensure /home/{{ local_user }}/.config/nvim dir exists
  ansible.builtin.file:
    path: "/home/{{ local_user }}/.config/nvim"
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"

- name: NVim | Ensure /home/{{ local_user }}/.config/nvim/lua dir exists
  ansible.builtin.file:
    path: "/home/{{ local_user }}/.config/nvim/lua"
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
      
#- name: NVim | Ensure /home/{{ local_user }}/.config/nvim/lua internal dirs exist
#  ansible.builtin.file:
